name: "Task"
description: Create a task or action item
title: "[TASK]: "
labels: ["task"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for creating a task!

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What needs to be done?
      placeholder: Describe the task or action item clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this task is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other relevant information, links, or dependencies.
      placeholder: Feel free to add any context, resources, or related issues that might help with this task.
